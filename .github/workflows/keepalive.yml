name: Supabase keep-alive

on:
  schedule:
    - cron: "0 8 * * 1,4"   # lundi et jeudi à 8h UTC
  workflow_dispatch:         # permet de le lancer à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -f -sS "${{ secrets.SUPABASE_URL }}/rest/v1/songs?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
            
