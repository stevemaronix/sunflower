<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titleAlbum">Hummingbird</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Water+Brush&family=DynaPuff&family=Clicker+Script&display=swap" rel="stylesheet">
</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const albumId = params.get("id");
    const itiswhat = params.get("whatisit");
</script>
<body>
    <main class="shell">
        <header class="album-page">
            <div class="align_cover_txt">
                <img class="album-cover"  id="cover">
                <div class="container_txt">
                    <div class="details" id="modalDetails"></div>
                    <h1 class = "album-title titre" id="albumTitle"></h1>
                    <p class="album-artist" id="artist"></p>
                    <p class="description" id="modalDescription"></p>
                    <div class="details" id="modalDetails2"></div>
                </div>
            </div>
        </header>
        <p id="count" class="meta">Chargement du catalogue...</p>
        <section class="grid" id="album_list" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        </section>
    </main>
    <a href="page.html" class="pill" id="retour"><- Retour</a>
</body>
<script src="shared.js"></script>
<script>
    const catalog = JSON.parse(sessionStorage.getItem("catalog"));
    const state = {
        songs: [],
        fromAlbum: []
    }

    const nodes = {
        list: document.getElementById("album_list"),
        count: document.getElementById("count"),
        cover: document.getElementById("cover"),
        artist: document.getElementById("artist"),
        albumTitle: document.getElementById("albumTitle")
    }

    function renderListSongs(){
        state.fromAlbum = state.songs.filter(song => song.album == albumId);
        nodes.list.innerHTML = state.fromAlbum.map(renderSongCard).join("");
        const total = state.fromAlbum.length;
        nodes.count.textContent = `${state.fromAlbum.length} chanson${state.fromAlbum.length > 1 ? "s" : ""} dans cet ${eq_col[itiswhat]}`;

    }

    function renderAlbum(){
        nodes.albumTitle.textContent = state.album?.name;
        nodes.artist.textContent =state.fromAlbum.filter(song => !getGroup(song).includes("ft."))[0] || getGroup(state.fromAlbum[0])?.name || getArtist(state.fromAlbum[0])?.name || "";
        nodes.cover.src = state.album?.pochette;
    }

    function loadAlbum(){
        state.album = getWhatever(state.songs[0]);
    }

    function loadSongs(forceRefresh = false){
        state.songs = catalog.songs.filter(song => song.album == albumId);
    }

    async function render(){
        loadSongs();
        loadAlbum();
        renderAlbum();
        renderListSongs();
        document.getElementById("titleAlbum").textContent = `${document.getElementById("titleAlbum").textContent}: ${state.album?.name}`;
    }

    render();

    nodes.list.addEventListener("click", async (event) => {
      const likeButton = event.target.closest(".like-button");
      if (likeButton) {
        event.stopPropagation();  // empêche d'ouvrir aussi la modale
        const card = likeButton.closest(".song");
        const id = Number(card.dataset.id);
        await toggleLike(state.songs.find(s => s.id === id), likeButton);
        refreshSession("songs",state.songs);
        return;
      }
      const card = event.target.closest(".song");
      if (!card) return;
      const id = Number(card.dataset.id);
      const song=state.songs.find(s => s.id === id);
      if (song.link){
        window.open(song.link,"_blank");
      }
    });

</script>
</html>
