<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hummingbird</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="shell">
        <header>
            <div class="align_cover_txt">
                <img class="cover-page"  id="cover">
                <div class="container_txt">
                <div class="details" id="modalDetails"></div>
                <a class = "link_title" id="albumTitle"></a>
                <p class="artist" id="artist"></p>
                <p class="description" id="modalDescription"></p>
                <div class="details" id="modalDetails2"></div>
                </div>
            </div>
        </header>
        <p id="count">Chargement du catalogue...</p>
        <section class="grid" id="album_list" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        </section>
    </main>
</body>
<script src="shared.js"></script>
<script>

    const params = new URLSearchParams(window.location.search);
    const albumId = params.get("id");
    const itiswhat = params.get("whatisit");

    state = {
        songs: [],
    }
    nodes = {
        list: document.getElementById("album_list"),
        count: document.getElementById("count"),
        cover: document.getElementById("cover"),
        artist: document.getElementById("artist"),
        albumTitle: document.getElementById("albumTitle")
    }

    function renderListSongs(itis,id){
        const songs=state.songs.filter(v => v[itis]?.id === id);
        console.table(songs);
        nodes.list.innerHTML = songs.map(renderSongCard).join("");
        const total = state.songs.length;
        nodes.count.textContent = `${songs.length} chanson${songs.length > 1 ? "s" : ""} affichée${songs.length > 1 ? "s" : ""} sur ${total}`;

    }

    function renderAlbum(){
        nodes.albumTitle.textContent = state.album?.name;
        nodes.artist.textContent = state.songs[0]?.groups?.name || state.songs[0]?.artists?.name || "";
        nodes.cover.src = state.album?.pochette;
    }

    async function loadAlbum(){
        const type = itiswhat;
        const response = await fetch(`${sup_url}${type}?select=id,name,sortie,pochette,link&id=eq.${albumId}`,
        {headers: {
            apikey: `${sup_key}`,
            Authorization: `Bearer ${sup_key}`,
        },
        })

        const data = await response.json()

        if (!response.ok){
            throw new Error(data.message || "Impossible de charger l'album");
        }
        state.album = Array.isArray(data) ? data[0] : {};
    }

    async function loadSongs(){
        try {
                const response = await fetch(`${sup_url}songs?select=id,title,description,year,artists(id,name),keywords,albums(id,name,pochette,link),theme,link,categories(name),groups(id,name),EP(id,name,pochette,link),singles(id,name,pochette,link),created_at&order=title.asc&${itiswhat}.id=eq.${albumId}`, {
                headers: {
                    apikey: `${sup_key}`,
                    Authorization: `Bearer ${sup_key}`,
                },
                });

                const data = await response.json()

                if (!response.ok) {
                throw new Error(data.message || "Impossible de charger les chansons.");
                }

                state.songs = Array.isArray(data) ? data : [];
                renderListSongs(itiswhat,albumId);
        } catch (error) {
            nodes.count.textContent = "Catalogue indisponible";
            nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
        }
    }
    await loadSongs();
    await loadAlbum();
    renderAlbum();
    renderListSongs();
</script>
</html>
