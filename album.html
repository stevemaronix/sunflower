<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hummingbird</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="shell">
        <header>
            <div class="align_cover_txt">
                <a class="modal-cover" target="_blank" id="modalCover"></a>
                <div class="container_txt">
                <div class="details" id="modalDetails"></div>
                <a class = "link_title" id="modalTitle"></a>
                <p class="artist" id="modalArtist"></p>
                <p class="description" id="modalDescription"></p>
                <div class="details" id="modalDetails2"></div>
                </div>
            </div>
        </header>
        <p id="count">Chargement du catalogue...</p>
        <section class="grid" id="album_list" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        </section>
    </main>
</body>
<script src="shared.js"></script>
<script>

    state = {
        songs: [],
    }
    nodes = {
        list: document.getElementById("album_list"),
        count: document.getElementById("count"),
    }

    function renderListSongs(){
        const songs=state.songs;
        nodes.list.innerHTML = songs.map(renderSongCard).join("");
        const total = state.songs.length;
        nodes.count.textContent = `${songs.length} chanson${songs.length > 1 ? "s" : ""} affichée${songs.length > 1 ? "s" : ""} sur ${total}`;

    }

    async function loadSongs(){
        const params = new URLSearchParams(window.location.search);
        const albumId = params.get("id");
        const itiswhat = params.get("whatisit");
        console.log("valeur reçue:", JSON.stringify(itiswhat));
        const finalUrl = `${sup_url}select=...&${itiswhat}.id=eq.${albumId}`;
        console.log("URL complète:", finalUrl);
        try {
                const response = await fetch(`${sup_url}select=id,title,description,year,artists(id,name),keywords,albums(id,name,pochette,link),theme,link,categories(name),groups(id,name),EP(id,name,pochette,link),singles(id,name,pochette,link),created_at&order=title.asc&${itiswhat}.id=eq.${albumId}`, {
                headers: {
                    apikey: `${sup_key}`,
                    Authorization: `Bearer ${sup_key}`,
                },
                });

                const data = await response.json()

                if (!response.ok) {
                throw new Error(data.message || "Impossible de charger les chansons.");
                }

                state.songs = Array.isArray(data) ? data : [];
                renderListSongs();
            } catch (error) {
                nodes.count.textContent = "Catalogue indisponible";
                nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
            }
    }
    loadSongs();
</script>
</html>
