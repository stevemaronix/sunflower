<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hummingbird</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="count">Chargement du catalogue...</p>
    <section class="grid" id="album_list" aria-live="polite">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>
</body>
<script src="shared.js"></script>
<script>

    state = {
        songs: [],
    }
    nodes = {
        list: document.getElementById("album_list"),
    }

    function renderListSongs(songs){
        nodes.list.innerHTML = songs.map(renderSongCard).join("");
        const total = state.songs.length;
        nodes.count.textContent = `${songs.length} chanson${songs.length > 1 ? "s" : ""} affichée${songs.length > 1 ? "s" : ""} sur ${total}`;

    }

    async function loadSongs(){
        const params = new URLSearchParams(window.location.search);
        const albumId = params.get("id");
        try {
                const response = await fetch(`https://wihxegbjecvfnmdtodvq.supabase.co/rest/v1/songs?select=id,title,description,year,artists(id,name),keywords,albums(id,name,pochette,link),theme,link,categories(name),groups(id,name),EP(name,pochette,link),singles(name,pochette,link),created_at&order=title.asc&id=${albumId}`, {
                headers: {
                    apikey: `${sup_key}`,
                    Authorization: `Bearer ${sup_key}`,
                },
                });

                const data = await response.json()

                if (!response.ok) {
                throw new Error(data.message || "Impossible de charger les chansons.");
                }

                state.songs = Array.isArray(data) ? data : [];
                renderFilters();
                renderList();
            } catch (error) {
                nodes.count.textContent = "Catalogue indisponible";
                nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
            }
    }
    loadSongs();
</script>
</html>
