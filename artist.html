<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titleArtist">Hummingbird</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Water+Brush&family=DynaPuff&family=Clicker+Script&display=swap" rel="stylesheet">
</head>
<script>
    const params = new URLSearchParams(window.location.search);
    const artistId = params.get("id");
    const artist = params.get("artist");
    const type = params.get("type");
</script>
<body>
    <a href="page.html" class="pill" id="retour"><- Retour</a>
    <main class=" artist-global shell">
        <header class="artist-page">
            <div class="align_photo_txt">
                <img class="artist-photo"  id="artistPhoto">
                <div class="container_txt">
                    <div class="details" id="modalDetails"></div>
                    <h1 class = "artist-title titre" id="artist"></h1>
                    <p class="artist-groups" id="groups"></p>
                    <p class="description" id="modalDescription"></p>
                    <div class="details" id="modalDetails2"></div>
                </div>
            </div>
        </header>
        <p id="count" class="meta">Chargement du catalogue...</p>
        <section class="grid" id="artistList" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        </section>
    </main>
</body>
<script src="shared.js"></script>
<script>

    const state = {
        songs: [],
        artist: {},
        groups: []
    }

    const nodes = {
        list: document.getElementById("artistList"),
        count: document.getElementById("count"),
        photo: document.getElementById("artistPhoto"),
        artist: document.getElementById("artist"),
        groups: document.getElementById("groups")
    }

    function renderListSongs(){
        nodes.list.innerHTML = state.songs.map(renderSongCard).join("");
        const total = state.songs.length;
        nodes.count.textContent = `${state.songs.length} chanson${state.songs.length > 1 ? "s" : ""} de ${titleCase(artist)}`;

    }

    function renderArtist(){
        nodes.artist.textContent = state.artist?.name;
        if (type==="artist"){
            nodes.groups.textContent = state.groups.map((group,index) => {
                if (index === state.groups.length - 1) return group.groups?.name.includes("ft.") ? "" : `${group.groups?.name},`;
                else return group.groups?.name.includes("ft.") ? "" : `${group.groups?.name},`;
            }).join("");
            nodes.photo.src = state.artist?.link || "";
        }
    }

    function renderSongCard(song,index) {
        const year = song.year ? `<span class="pill">${escapeHtml(song.year)}</span>` : "";
        const theme = song.theme ? `<span class="pill">${escapeHtml(song.theme)}</span>` : "";
        const keywords = song.keywords ? `<span class="pill">${escapeHtml(song.keywords)}</span>` : "";
        const link = song.link || song.lien;
        const album = song[whatisit(song)]?.name ? `<span class="pill">${escapeHtml(song[whatisit(song)]?.name)}</span>` : "";
        const category = song.categories?.name ? `<span class="pill">${escapeHtml(song.categories?.name)}</span>` : "";

        return `
          <article class="song" data-index="${index}">
            <div>
              <h2 class="titre">${escapeHtml(song.title || "Sans titre")}</h2>
              ${(song.groups?.name && type==="artist") ? `<p class="artist">${song.groups.name}</p>` : ""}
            </div>
            <div class="details">${album}${year}${theme}</div>
          </article>
        `;
    }

    async function loadArtist(){
        const response = await fetch(`${sup_url}${type}s?select=id,name,link&id=eq.${artistId}`,
        {headers: {
            apikey: `${sup_key}`,
            Authorization: `Bearer ${sup_key}`,
        },
        })

        const data = await response.json()

        if (!response.ok){
            throw new Error(data.message || "Impossible de charger l'artist");
        }
        state.artist = Array.isArray(data) ? data[0] : {};
    }

    async function loadSongs(){
        try {
                const groupIds = state.groups.map(g => g.group_id);

                const query = groupIds.length
                    ? `or=(artist.eq.${artistId},groupe.in.(${groupIds.join(",")}))`
                    : `artist=eq.${artistId}`;
                    
                const response = await fetch(`${sup_url}songs?select=id,title,artist,description,year,keywords,artists(id,name,link),theme,link,categories(name),groups(id,name),EP(id,pochette,link),singles(id,pochette,link),created_at&order=title.asc&${query}`, {
                headers: {
                    apikey: `${sup_key}`,
                    Authorization: `Bearer ${sup_key}`,
                },
                });

                const data = await response.json()

                if (!response.ok) {
                throw new Error(data.message || "Impossible de charger les chansons.");
                }

                state.songs = Array.isArray(data) ? data : [];
                console.log(state.songs);
                renderListSongs();
        } catch (error) {
            nodes.count.textContent = "Catalogue indisponible";
            nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
        }
    }

    async function loadGroups(){
        try {
                const response = await fetch(`${sup_url}artist_group?select=artist_id,group_id,artists(id,name),groups(id,name)&artist_id=eq.${artistId}`, {
                headers: {
                    apikey: `${sup_key}`,
                    Authorization: `Bearer ${sup_key}`,
                },
                });

                const data = await response.json()

                if (!response.ok) {
                throw new Error(data.message || "Impossible de charger les chansons.");
                }

                state.groups = Array.isArray(data) ? data : [];
                console.log(state.groups);
        } catch (error) {
            nodes.count.textContent = "Catalogue indisponible";
            nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
        }
    }

    async function render(){
        await loadArtist();
        await loadGroups();
        await loadSongs();
        renderArtist();
        document.getElementById("titleArtist").textContent = `${document.getElementById("titleArtist").textContent}: ${state.artist?.name}`;
    }


    render();

    nodes.list.addEventListener("click", (event) => {
      const card = event.target.closest(".song");
      if (!card) return;
      const index = Number(card.dataset.index);
      const song=state.songs[index];
      if (song.link){
        window.open(song.link,"_blank");
      }
    });

</script>
</html>
