<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="title_artist">Hummingbird</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Water+Brush&family=DynaPuff&family=Clicker+Script&display=swap" rel="stylesheet">
</head>
<script>
    const params = new URLSearchParams(window.location.search);
    const artistId = params.get("id");
    const artist = params.get("artist");
</script>
<body>
    <a href="index.html" class="pill" id="retour"><- Retour</a>
    <main class="shell">
        <header class="artist-page">
            <div class="align_photo_txt">
                <img class="artist-photo"  id="artistPhoto">
                <div class="container_txt">
                    <div class="details" id="modalDetails"></div>
                    <a class = "artist-title titre" id="artist"></a>
                    <p class="artist-groups" id="groups"></p>
                    <p class="description" id="modalDescription"></p>
                    <div class="details" id="modalDetails2"></div>
                </div>
            </div>
        </header>
        <p id="count" class="meta">Chargement du catalogue...</p>
        <section class="grid" id="artistList" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        </section>
    </main>
</body>
<script src="shared.js"></script>
<script>

    const state = {
        songs: [],
        artist: {},
    }

    const nodes = {
        list: document.getElementById("artistList"),
        count: document.getElementById("count"),
        photo: document.getElementById("artistPhoto"),
        artist: document.getElementById("artist"),
        groups: document.getElementById("groups")
    }

    function renderListSongs(){
        nodes.list.innerHTML = state.songs.map(renderSongCard).join("");
        const total = state.songs.length;
        nodes.count.textContent = `${state.songs.length} chanson${state.songs.length > 1 ? "s" : ""} de${artist}`;

    }

    function renderArtist(){
        nodes.artist.textContent = state.artist?.name;
        nodes.groups.textContent = state.groups.map((group,index) => {
            const prev = nodes.groups.textContent;
            if (index === groups.length - 1){
                return `${group.groups?.name}`;
            }
            return `${group.groups?.name},`;
        })
        nodes.photo.src = state.artist?.link || "";
    }

    async function loadArtist(){
        const response = await fetch(`${sup_url}artists?select=id,name,link,genre&id=eq.${artistId}`,
        {headers: {
            apikey: `${sup_key}`,
            Authorization: `Bearer ${sup_key}`,
        },
        })

        const data = await response.json()

        if (!response.ok){
            throw new Error(data.message || "Impossible de charger l'artist");
        }
        state.artist = Array.isArray(data) ? data[0] : {};
    }

    async function loadSongs(){
        try {
                const response = await fetch(`${sup_url}songs?select=id,title,artist,description,year,keywords,artists(id,name,link),theme,link,categories(name),groups(id,name),EP(id,pochette,link),singles(id,pochette,link),created_at&order=title.asc&artist=eq.${artistId}`, {
                headers: {
                    apikey: `${sup_key}`,
                    Authorization: `Bearer ${sup_key}`,
                },
                });

                const data = await response.json()

                if (!response.ok) {
                throw new Error(data.message || "Impossible de charger les chansons.");
                }

                state.songs = Array.isArray(data) ? data : [];
                console.log(state.songs);
                renderListSongs();
        } catch (error) {
            nodes.count.textContent = "Catalogue indisponible";
            nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
        }
    }

    async function loadGroups(){
        try {
                const response = await fetch(`${sup_url}artist_group?select=artist_id,group_id,artists(id,name),groups(id,name)&artist_id=eq.${artistId}`, {
                headers: {
                    apikey: `${sup_key}`,
                    Authorization: `Bearer ${sup_key}`,
                },
                });

                const data = await response.json()

                if (!response.ok) {
                throw new Error(data.message || "Impossible de charger les chansons.");
                }

                state.groups = Array.isArray(data) ? data : [];
                console.log(state.groups);
        } catch (error) {
            nodes.count.textContent = "Catalogue indisponible";
            nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
        }
    }

    async function render(){
        await loadSongs();
        await loadArtist();
        await loadGroups();
        renderArtist();
    }

    render();
</script>
</html>
