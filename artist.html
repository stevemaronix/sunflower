<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titleArtist">Hummingbird</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Water+Brush&family=DynaPuff&family=Clicker+Script&display=swap" rel="stylesheet">
</head>
<script>
    const params = new URLSearchParams(window.location.search);
    const artistId = params.get("id");
    const artist = params.get("artist");
    const type = params.get("type");
</script>
<body>
    <a href="page.html" class="pill" id="retour"><- Retour</a>
    <main class=" artist-global shell">
        <header class="artist-page">
            <div class="align_photo_txt">
                <img class="artist-photo"  id="artistPhoto">
                <div class="container_txt">
                    <div class="details" id="modalDetails"></div>
                    <h1 class = "artist-title titre" id="artist"></h1>
                    <p class="artist-groups" id="groups"></p>
                    <p class="description" id="modalDescription"></p>
                    <div class="details" id="modalDetails2"></div>
                </div>
            </div>
        </header>
        <p id="count" class="meta">Chargement du catalogue...</p>
        <section class="grid" id="artistList" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        </section>
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>

    const catalog = JSON.parse(sessionStorage.getItem("catalog"));

    const state = {
        songs: [],
        fromArtist: [],
        artist: {},
        groups: []
    }

    const nodes = {
        list: document.getElementById("artistList"),
        count: document.getElementById("count"),
        photo: document.getElementById("artistPhoto"),
        artist: document.getElementById("artist"),
        groups: document.getElementById("groups")
    }

    function renderListSongs(){
        nodes.list.innerHTML = state.songs.map(renderSongCard).join("");
        const total = state.songs.length;
        nodes.count.textContent = `${state.songs.length} chanson${state.songs.length > 1 ? "s" : ""} de ${titleCase(artist)}`;

    }

    function renderArtist(){
        nodes.artist.textContent = state.artist?.name;
        if (type==="artist"){
            nodes.groups.textContent = state.groups.map((group,index) => {
                if (index === state.groups.length - 1) return group?.name.includes("ft.") ? "" : `${group?.name}`;
                else return group?.name.includes("ft.") ? "" : `${group?.name},`;
            }).join("");
            nodes.photo.src = state.artist?.link ?? "url(logo2.png)";
        }
    }

    function renderSongCard(song,index) {
        const liked = song?.liked ? "<img src='star_record_filled.png' class='like-button'>" : "<img src='star_record_empty.png' class='like-button'>"; 
        const year = song.year ? `<span class="pill">${escapeHtml(song.year)}</span>` : "";
        const theme = song.theme ? `<span class="pill">${escapeHtml(song.theme)}</span>` : "";
        const keywords = song.keywords ? `<span class="pill">${escapeHtml(song.keywords)}</span>` : "";
        const link = song.link || song.lien;
        const album = song[whatisit(song)]?.name ? `<span class="pill">${escapeHtml(song[whatisit(song)]?.name)}</span>` : "";
        const category = song.categories?.name ? `<span class="pill">${escapeHtml(song.categories?.name)}</span>` : "";

        return `
          <article class="song" data-index="${index}" data-id="${song.id}">
            ${liked}
            <div class="song-header">
              <h2 class="titre">${escapeHtml(song.title || "Sans titre")}</h2>
              ${(song.groups?.name && type==="artist") ? `<p class="artist">${song.groups.name}</p>` : ""}
            </div>
            <div class="details">${album}${year}${theme}</div>
          </article>
        `;
    }

    function loadArtist(){
        if (type === "artist") {
            state.artist = catalog.artists.find(a => a.id == artistId);
        } else {
            state.artist = catalog.groups.find(g => g.id == artistId);
        }
    }

    function loadSongs(){
        const groupIds = state.groups.map(g => g.id);
        state.songs = catalog.songs.filter(song => song.artist == artistId || groupIds.includes(Number(song.group)));
    }
    
    function loadGroups(){
        const assoc = catalog.artist_group.filter(
            ag => ag.artist_id == artistId
        );
        console.log(assoc);
        state.groups = assoc.map(ass => catalog?.groupById[ass.group_id]).filter(Boolean);
        console.log(state.groups);
    }

    async function render(){
        loadArtist();
        loadGroups();
        console.log(state.groups);
        loadSongs();
        renderArtist();
        document.getElementById("titleArtist").textContent = `${document.getElementById("titleArtist").textContent}: ${state.artist?.name}`;
        renderListSongs();
    }


    render();

    nodes.list.addEventListener("click", async (event) => {
      const likeButton = event.target.closest(".like-button");
      if (likeButton) {
        event.stopPropagation();  // empêche d'ouvrir aussi la modale
        const card = likeButton.closest(".song");
        const id = Number(card.dataset.id);
        await toggleLike(catalog.songs.find(s => s.id === id), likeButton);
        refreshSession("catalog",catalog);
        return;
      }
      const card = event.target.closest(".song");
      if (!card) return;
      const id = Number(card.dataset.id);
      const song=state.songs.find(song => song.id === id);
      if (song.link){
        window.open(song.link,"_blank");
      }
    });

</script>
</html>
