<!DOCTYPE html>
<html lang="fr"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titleAlbum">Hummingbird: Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Water+Brush&family=DynaPuff&family=Clicker+Script&display=swap" rel="stylesheet">
</head>
<body class="sign-in-page">
    <div class="center-rectangle">
        <img src="logo2.png">
        <div class="inputs">
            <div class="sign-field">
                <label for="mail-input">Addresse e-mail</label>
                <input id="mail-input" placeholder="Entrez votre adresse e-mail">
            </div>
            <div class="sign-field">
                <label for="pwd-input">Mot de passe</label>
                <input id="pwd-input" placeholder="Entrez votre mot de passe">
            </div>
        </div>
        <div class="connexion-bar">
            <button class="connexion-button" id="connection">Se connecter</button>
            <button class="signing-button" id="sign">S'inscrire</button>
        </div>
    </div>
</body>
<script>
    state = {

        mail: "",
        mdp: "",
    }
    document.getElementById("nothing").addEventListener("click", () => {window.location.href="page.html"});
</script>
</html>
