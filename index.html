<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hummingbird</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #5d0317;
      --muted: #5d0317;
      --paper: #fcffd3f5;
      --panel: #f4e16e;
      --line: #5d0317;
      --accent: #9d3f2f;
      --accent-dark: #64291f;
      --moss: #53634c;
      --shadow: 0 18px 50px #5d0317d9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(83, 99, 76, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(157, 63, 47, 0.07) 1px, transparent 1px),
        var(--paper);
      background-size: 42px 42px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0;
    }

    a {
      text-decoration : none;
      color : inherit;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
      gap: 28px;
      align-items: end;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 6.8rem);
      line-height: 0.87;
      letter-spacing: 0;
      max-width: 720px;
    }

    .intro {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 1.03rem;
      line-height: 1.65;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 170px 170px;
      gap: 12px;
      padding: 14px;
      background: #5d0317;
      border: 1px solid #000000;
      box-shadow: var(--shadow);
      position: sticky;
      top: 12px;
      z-index: 3;
      backdrop-filter: blur(10px);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: #fa9fb2;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input,
    select {
      min-height: 44px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px 12px;
      color: var(--ink);
      background: #fffaf1;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(157, 63, 47, 0.14);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin: 22px 0 12px;
      color: var(--muted);
    }

    .align_cover_txt {
      display:flex;
      gap : 48px;
    }

    .container_txt {
      flex : 65%;
    }

    .reset {
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 8px 13px;
      color: var(--accent-dark);
      background: transparent;
      cursor: pointer;
    }

    .reset:hover {
      background: rgba(157, 63, 47, 0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
    }
    .overlay.open {
      display: flex;
    }
    .modal {
      background: var(--panel);
      border-radius: 8px;
      padding: 24px;
      /*max-width: 420px;*/
      width: 70%;
      min-width: 800px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--ink);
    }
    .modal-cover {
      flex : 35%;
      aspect-ratio: 1;
      background: var(--line);
      background-size: cover;
      padding : 10px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    #modalTitle {
        display: block;
        font-size: clamp(1.7rem, 3vw, 4.3rem);
        font-weight: bold;
        line-height: 1;
        margin-bottom: 0.3em;
    }

    #modalArtist {
        font-size: clamp(1.3rem, 2vw, 2.2rem);
        margin: 0 0 1em 0;
        opacity: 0.8;
    }

    #modalDescription {
        font-size: clamp(1rem, 1.2vw, 1.4rem);
        line-height: 1.6;
    }

    .song {
      display: grid;
      min-height: 190px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      box-shadow: 0 8px 26px rgba(70, 55, 39, 0.08);
    }

    .song h2 {
      margin: 0 0 10px;
      font-size: 1.55rem;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .link_title a {
      margin: 0 0 10px;
      font-size: 1.55rem;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .artist {
      margin: 0;
      color: var(--accent-dark);
      font-size: 1.05rem;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-self: end;
      margin-top: 24px;
    }

    .pill {
      border: 1px solid rgba(83, 99, 76, 0.32);
      border-radius: 999px;
      padding: 6px 9px;
      color: var(--moss);
      background: rgba(83, 99, 76, 0.08);
      font-size: 0.88rem;
    }

    .listen {
      justify-self: start;
      align-self: end;
      margin-top: 18px;
      color: var(--panel);
      background: var(--ink);
      border-radius: 999px;
      padding: 9px 13px;
      text-decoration: none;
    }

    .notice {
      padding: 28px;
      border: 1px dashed var(--line);
      color: var(--muted);
      background: rgba(255, 253, 248, 0.72);
    }

    .skeleton {
      min-height: 190px;
      border-radius: 6px;
      background: linear-gradient(110deg, rgba(255, 253, 248, 0.78), rgba(222, 211, 197, 0.46), rgba(255, 253, 248, 0.78));
      background-size: 220% 100%;
      animation: load 1.2s ease-in-out infinite;
      border: 1px solid var(--line);
    }

    .display_category.close {
      display : none;
    }

    @keyframes load {
      to {
        background-position: -220% 0;
      }
    }

    @media (max-width: 820px) {
      header,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .shell {
        width: min(100% - 24px, 1180px);
        padding: 26px 0;
      }

      .toolbar {
        position: static;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>Hummingbird</h1>
    </header>

    <section class="toolbar" aria-label="Filtres de recherche">
      <div class="field">
        <label for="art_search">Artiste</label>
        <input id="art_search" type="search" placeholder="ex. Aitana">
        <label for="title_search">Titre</label>
        <input id="title_search" type="search" placeholder="ex. Mamma Mia">
        <label for="theme">Thème</label>
        <select id="theme">
          <option value="">Tous les thèmes</option>
        </select>
        <div class="display_category close" id="theme_category">
          <label for="category">Catégorie</label>
          <select id="category">
            <option value="">Toutes les catégories</option>
          </select>
        </div>
      </div>
    </section>

    <div class="meta">
      <p id="count">Chargement du catalogue...</p>
      <button class="reset" id="reset" type="button">Réinitialiser</button>
    </div>

    <section class="grid" id="list" aria-live="polite">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>
  </main>
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
      <div class="align_cover_txt">
        <div class="modal-cover" id="modalCover"></div>
        <div class="container_txt">
          <a class = "link_title" id="modalTitle"></a>
          <p class="artist" id="modalArtist"></p>
          <p class="description" id="modalDescription"></p>
          <div class="details" id="modalDetails"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      songs: [],
      query: "",
      title : "",
      theme: "",
      category: "",
      artist: "",
    };

    const nodes = {
      title: document.getElementById("title_search"),
      theme: document.getElementById("theme"),
      category: document.getElementById("category"),
      artist: document.getElementById("art_search"),
      count: document.getElementById("count"),
      list: document.getElementById("list"),
      reset: document.getElementById("reset"),
    };

    const normalize = (value) => String(value || "").toLocaleLowerCase("fr").trim();

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function getSearchText(song) {
      return {
        album : normalize(song.albums?.album),
        title : normalize(song.title),
        artist : normalize(song.artists?.name),
        groupe: normalize(song.groups?.name),
        theme : normalize(song.theme),
        category : normalize(song.categorie),
        keyword : normalize(song.keywords),
        year : normalize(song.year),
      }
    }

    function getFilteredSongs() {
      const q_art = normalize(state.artist);
      const q_tit = normalize(state.title);

      return state.songs.filter((song) => {
        const artist = song.artists?.name || "";
        const groupe = song.groups?.name || "";
        const titre = song.title || "";
        const matchesQueryArtist = !q_art || getSearchText(song).groupe.includes(q_art) || getSearchText(song).artist.includes(q_art);
        const matchesTheme = !state.theme || song.theme === state.theme;
        const matchesCategory = !state.category || song.categorie == state.category;
        const matchesQueryTitle = !q_tit || getSearchText(song).title.includes(q_tit);
        return matchesQueryArtist && matchesTheme && matchesQueryTitle && matchesCategory;
      });
    }

    function fillSelect(select, values, placeholder) {
      const currentValue = select.value;
      select.innerHTML = `<option value="">${placeholder}</option>` + 
      values.map((value) => 
      `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
      select.value = values.includes(currentValue) ? currentValue : "";
    }

    function renderFilters() {
      const themes = [...new Set(state.songs.map((song) => song.theme).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
      const categories = [...new Set(state.songs.map((song)=>song.categorie).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr"));
      fillSelect(nodes.theme, themes, "Tous les thèmes");
      fillSelect(nodes.category, categories, "Toutes les catégories");
    }

    function renderList() {
      const songs = getFilteredSongs();
      currentFilteredSongs = songs;
      const total = state.songs.length;
      nodes.count.textContent = `${songs.length} chanson${songs.length > 1 ? "s" : ""} affichée${songs.length > 1 ? "s" : ""} sur ${total}`;

      if (!songs.length) {
        nodes.list.innerHTML = '<div class="notice">Aucune chanson ne correspond à ces filtres.</div>';
        return;
      }

      nodes.list.innerHTML = songs.map((song,index) => {
        const artist = song.groups?.name || song.artists?.name || "Artiste inconnu";
        const year = song.year ? `<span class="pill">${escapeHtml(song.year)}</span>` : "";
        const theme = song.theme ? `<span class="pill">${escapeHtml(song.theme)}</span>` : "";
        const keywords = song.keywords ? `<span class="pill">${escapeHtml(song.keywords)}</span>` : "";
        const link = song.link || song.lien;
        const album = song.albums?.album ? `<span class="pill">${escapeHtml(song.albums?.album)}</span>` : "";

        return `
          <article class="song" data-index="${index}">
            <div>
              <h2>${escapeHtml(song.title || "Sans titre")}</h2>
              <p class="artist">${escapeHtml(artist)}</p>
            </div>
            <div class="details">${album}${year}</div>
          </article>
        `;
      }).join("");
    }

  let currentFilteredSongs = [];

  function openModal(song) {
    const artist = song.groups?.name || song.artists?.name || "Artiste inconnu";
    document.getElementById("modalTitle").textContent = song.title || "Sans titre";
    document.getElementById("modalTitle").href = song.link || "#";
    document.getElementById("modalTitle").target = "_blank";
    document.getElementById("modalArtist").textContent = artist;
    document.getElementById("modalDescription").textContent = song.description || "";
    document.getElementById("modalDetails").innerHTML = [
      song.albums?.album, song.year,song.theme 
    ].filter(Boolean).map(v => `<span class="pill">${escapeHtml(v)}</span>`).join("");

    const cover = document.getElementById("modalCover");
    cover.style.backgroundImage = song.albums?.pochette ? `url(${song.albums?.pochette})` : "none";

    document.getElementById("overlay").classList.add("open");
  }

  function closeModal() {
    document.getElementById("overlay").classList.remove("open");
  }


    async function loadSongs() {
      try {
        const url = "https://wihxegbjecvfnmdtodvq.supabase.co/rest/v1/songs?select=id,title,description,year,artists(id,name),albums(id,album,pochette),theme,link,categorie,groups(id,name),created_at&order=title.asc";
        const response = await fetch(url, {
          headers: {
            apikey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpaHhlZ2JqZWN2Zm5tZHRvZHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0OTUzNzgsImV4cCI6MjA5OTA3MTM3OH0.Wwr1x3mj_e8fSiSi4NT8CYP1w0wGYbbms1040kFmGRo",
            Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpaHhlZ2JqZWN2Zm5tZHRvZHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0OTUzNzgsImV4cCI6MjA5OTA3MTM3OH0.Wwr1x3mj_e8fSiSi4NT8CYP1w0wGYbbms1040kFmGRo",
          },
        });

        const data = await response.json()

        if (!response.ok) {
          throw new Error(data.message || "Impossible de charger les chansons.");
        }

        state.songs = Array.isArray(data) ? data : [];
        renderFilters();
        renderList();
      } catch (error) {
        nodes.count.textContent = "Catalogue indisponible";
        nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
      }
    }

    nodes.artist.addEventListener("input", (event) => {
      state.artist = event.target.value;
      renderList();
    });

    nodes.title.addEventListener("input",(event) => 
    {state.title = event.target.value; renderList();});

    nodes.theme.addEventListener("change", (event) => {
      state.theme = event.target.value;
      nodes.theme.value === "" ? nodes.category.classList.add("close") : nodes.category.classList.remove("close");
      renderList();
    });

    nodes.reset.addEventListener("click", () => {
      state.title = "";
      state.theme = "";
      state.artist = "";
      nodes.title.value = "";
      nodes.theme.value = "";
      nodes.category.value = "";
      nodes.artist.value = "";
      renderList();
    });

    nodes.list.addEventListener("click", (event) => {
      const card = event.target.closest(".song");
      if (!card) return;
      const index = Number(card.dataset.index);
      openModal(currentFilteredSongs[index]);
    });

    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", (event) => {
      if (event.target.id === "overlay") closeModal();
    });


    loadSongs();
  </script>
</body>
</html>
