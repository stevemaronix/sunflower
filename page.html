<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hummingbird</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo2.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Water+Brush&family=DynaPuff&family=Clicker+Script&display=swap" rel="stylesheet">
</head>
<button id="up" aria-label="Retour en haut">↑</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<body>
  <main class="shell">
    <header class="head-index">
      <img src="logo2.png" id="logo">
    </header>

    <section class="toolbar" aria-label="Filtres de recherche">
      <div class="field">
        <div class="search_theme">
          <div class="field">
            <label for="theme">Thème</label>
            <select id="theme">
              <option value="">Tous les thèmes</option>
            </select>
          </div>
          <div class="field display_category close" id="theme_category">
            <label for="category">Catégorie</label>
            <select id="category">
              <option value="">Toutes les catégories</option>
            </select>
          </div>
          <div class="field">
            <label for="kw_search">Mots-clés</label> 
            <input id="kw_search" type="search" placeholder="ex. car love sad">
          </div>
        </div>
        <label for="title_search">Titre</label>
        <input id="title_search" type="search" placeholder="ex. Mamma Mia">
        <label for="art_search">Artiste</label>
        <input id="art_search" type="search" placeholder="ex. Aitana">
        <div class="search_theme">
          <div class="field">
            <label for="year_search">Année</label>
            <input id="year_search" type="search" placeholder="ex. 2026">
          </div>
          <div class="field">
            <label for="year_filter">Filtre</label>
            <select id="year_filter">
              <option selected value="equal">égale</option>
              <option value="greater">supérieure</option>
              <option value="less">inférieure</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <div class="meta">
      <p id="count">Chargement du catalogue...</p>
      <p class="sort-inline">
        Trier par :
        <select id="sort_songs">
          <option selected value="title">Titre</option>
          <option value="artist">Artiste</option>
          <option value="theme">Thème</option>
          <option value="year">Année</option>
        </select>
      </p>
      <button class="reset" id="reset" type="button">Réinitialiser</button>
    </div>

    <section class="proposal">
      <div class="prop-title">
        <h1>Une proposition ?</h1>
      </div>
      <div class="prop-fields">
        <label for="titleSuggestion">Titre</label>
        <input id="titleSuggestion" type="search" placeholder="C'est quoi le titre ?">
        <label for="artistSuggestion">Artiste</label>
        <input id="artistSuggestion" type="search" placeholder="Et c'est de qui ?">
        <button id="suggest">Envoyer</button>
      </div>
    </section>

    <section class="grid hide" id="list" aria-live="polite">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>
  </main>
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
      <div class="align_cover_txt">
        <a class="modal-cover" target="_blank" id="modalCover"></a>
        <div class="container_txt">
          <div class="details" id="modalDetails"></div>
          <a class = "link_title titre" id="modalTitle"></a>
          <p class="artist" id="modalArtist"></p>
          <p class="description" id="modalDescription"></p>
          <div class="details" id="modalDetails2"></div>
        </div>
      </div>
    </div>
  </div>

  <button id="menuToggle" aria-label="Menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <nav id="sideMenu" class="side-menu">
    <a href="page.html">Recherche</a>
    <a href="all.html">Index</a>
    <a href="records.html">Mes records</a>
    <a href="suggest.html">Suggestions personnalisées</a>
    <button class="bouton-menu" onclick="downloadCatalog()">Télécharger le catalogue</button>
  </nav>

  <div id="menuOverlay" class="menu-overlay"></div>

  <script src="shared.js"></script>
  <script>
    const client = supabase.createClient(client_url,sup_key);
    const state = {
      songs: [],
      query: "",
      title : "",
      theme: "",
      kw: "",
      year: "",
      year_filter: "equal",
      category: "",
      artist: "",
      sort_song: "title",
    };

    const props = {
      title: document.getElementById("titleSuggestion"),
      artist: document.getElementById("artistSuggestion"),
      suggest: document.getElementById("suggest")
    }

    const nodes = {
      title: document.getElementById("title_search"),
      year: document.getElementById("year_search"),
      year_filter: document.getElementById("year_filter"),
      theme: document.getElementById("theme"),
      category: document.getElementById("category"),
      categoryWrap: document.getElementById("theme_category"),
      artist: document.getElementById("art_search"),
      count: document.getElementById("count"),
      list: document.getElementById("list"),
      keywords: document.getElementById("kw_search"),
      reset: document.getElementById("reset"),
      sort_song: document.getElementById("sort_songs"),
    };

    const modals = {
      title: document.getElementById("modalTitle"),
      artist: document.getElementById("modalArtist"),
      description: document.getElementById("modalDescription"),
      details: document.getElementById("modalDetails"),
      details2: document.getElementById("modalDetails2"),
      cover: document.getElementById("modalCover"),
      close: document.getElementById("modalClose")
    }

    

    function getSearchText(song) {
      return {
        album : normalize(getWhatever(song)?.name),
        title : normalize(song.title),
        artist : normalize(getArtist(song)?.name),
        groupe: normalize(getGroup(song)?.name),
        theme : normalize(song.theme),
        category : normalize(getCategory(song)?.name),
        keyword : normalize(song.keywords),
        year : normalize(song.year),
      }
    }

    function matchesYear(song){
      if (state.year.length < 4) return true;
      const yearValue = Number(state.year);
      if (state.year_filter === "greater") return song.year >= yearValue;
      if (state.year_filter === "less") return song.year <= yearValue;
      return song.year === yearValue;
    }

    function getFilteredSongs() {
      const q_art = normalize(state.artist);
      const q_tit = normalize(state.title);
      const q_kw = state.kw.split(" ").map(v => normalize(v)).filter(Boolean); 

      return state.songs.filter((song) => {
        const artist = getArtist(song)?.name || "";
        const groupe = getGroup(song)?.name || "";
        const titre = song.title || "";
        const year = song.year || "";
        const matchesQueryArtist = !q_art || getSearchText(song).groupe.includes(q_art) || getSearchText(song).artist.includes(q_art);
        const matchesTheme = !state.theme || song.theme === state.theme;
        const matchesCategory = !state.category || getCategory(song)?.name == state.category;
        const matchesQueryTitle = !q_tit || getSearchText(song).title.includes(q_tit);
        const matchesQueryYear = matchesYear(song);
        const matchesQueryKw = !q_kw.length || q_kw.some(element => song.keywords?.includes(element));
        return matchesQueryArtist && matchesTheme && matchesQueryKw && matchesQueryTitle && matchesCategory && matchesQueryYear;
      });
    }

    function fillSelect(select, values, placeholder) {
      const currentValue = select.value;
      select.innerHTML = `<option value="">${placeholder}</option>` + 
      values.map((value) => 
      `<option value="${escapeHtml(value)}" style="font-weight: bold">${capitalize(escapeHtml(value))}</option>`).join("");
      select.value = values.includes(currentValue) ? currentValue : "";
    }

    function renderFilters() {
      const themes = [...new Set(state.songs.map((song) => song.theme).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
      const categories = [...new Set(state.songs.map((song)=>(normalize(song.theme) == normalize(state.theme)) ? getCategory(song)?.name : "").filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr"));
      fillSelect(nodes.theme, themes, "Tous les thèmes");
      fillSelect(nodes.category, categories, "Toutes les catégories");
    }
    function getSortValue(song, key){
      if (key === "artist") return getArtist(song)?.name || "";
      return song[key] || "";
    }

    function sortSongs(songs) {
      return songs.sort((a, b) => {
        const valA = getSortValue(a,state.sort_song);
        const valB = getSortValue(b,state.sort_song)
        if (typeof valA === "number" && typeof valB === "number") {
          return valA - valB;
        }
        return String(valA).localeCompare(String(valB), "fr");
      });
    }

    function renderList() {
      const songs = sortSongs(getFilteredSongs());
      currentFilteredSongs = songs;
      sortingCriteria = nodes.sort_song.value;
      const total = state.songs.length;
      nodes.count.textContent = `${songs.length} chanson${songs.length > 1 ? "s" : ""} affichée${songs.length > 1 ? "s" : ""} sur ${total}`;

      if (!songs.length) {
        nodes.list.innerHTML = '<div class="notice">Aucune chanson ne correspond à ces filtres.</div>';
        return;
      }
      nodes.list.innerHTML = songs.map(renderSongCard).join("");
    }

  let currentFilteredSongs = [];

    async function loadSongs(forceRefresh = false) {
      try {
        if (!forceRefresh) {
          const cached = sessionStorage.getItem("catalog");
          if (cached) {
            console.table(cached);
            catalog = JSON.parse(cached);
            state.songs = catalog.songs;
            renderFilters();
            renderList();
            return
          };
      }
        const { data: { user } } = await client.auth.getUser();

        const {data, error} = await client.rpc("get_catalog", {
            uid: user?.id ?? null
        });

        if (error) {
          throw new Error(data.message || "Impossible de charger les chansons.");
        }

        catalog = data;
        console.table(catalog);
        catalog.artistById = Object.fromEntries(
            catalog.artists.map(a => [a.id, a])
        );

        catalog.groupById = Object.fromEntries(
            catalog.groups?.map(g => [g.id, g])
        );

        catalog.albumById = Object.fromEntries(
            catalog.albums?.map(a => [a.id, a])
        );

        catalog.epById = Object.fromEntries(
            catalog.ep?.map(a => [a.id, a])
        );
        catalog.singleById = Object.fromEntries(
            catalog.singles.map(a => [a.id, a])
        );

        catalog.artistGroupByGroup = Object.groupBy(
            catalog.artist_group,
            row => row.group_id
        );

        catalog.categoryById = Object.fromEntries(
            catalog.categories.map(c => [c.id, c])
        );

        state.songs = Array.isArray(catalog.songs) ? catalog.songs : [];

        console.log("AVANT STRINGIFY");
        const json = JSON.stringify(catalog);
        console.log("STRINGIFY OK");
        sessionStorage.setItem("catalog", json);

        renderFilters();
        renderList();

      } catch (error) {
        nodes.count.textContent = "Catalogue indisponible";
        nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
      }
    }

    nodes.artist.addEventListener("input", (event) => {
      state.artist = event.target.value;
      renderList();
    });

    nodes.title.addEventListener("input",(event) => 
    {state.title = event.target.value; renderList();});

    nodes.year.addEventListener("input",(event) => {state.year = event.target.value; renderList();})
    nodes.year_filter.addEventListener("change", (event) => {state.year_filter = event.target.value; renderList();})

    nodes.theme.addEventListener("focus",(event) => previousTheme = event.target.value);

    nodes.theme.addEventListener("change", (event) => {
      state.theme = event.target.value;
      if (state.theme != previousTheme){
        nodes.category.value = "";
        state.category="";
      }
      nodes.theme.value === "" ? nodes.categoryWrap.classList.add("close") : nodes.categoryWrap.classList.remove("close");
      renderList();
      renderFilters();
    });

    nodes.category.addEventListener("change", (event) => {
      state.category = event.target.value;
      renderList();
    })

    nodes.keywords.addEventListener("input", (event) => {
      state.kw = event.target.value;
      renderList();
    })

    nodes.reset.addEventListener("click", () => {
      state.title = "";
      state.year = "";
      state.theme = "";
      state.category = "";
      state.artist = "";
      state.kw = "";
      nodes.year.value = "";
      nodes.year_filter.value = "equal";
      nodes.title.value = "";
      nodes.theme.value = "";
      nodes.category.value = "";
      nodes.categoryWrap.classList.add("close");
      nodes.keywords.value="";
      nodes.artist.value = "";
      renderFilters()
      renderList();
    });

    nodes.sort_song.addEventListener("change", (event) => {state.sort_song = event.target.value; renderList();})

    nodes.list.addEventListener("click", async (event) => {
      const likeButton = event.target.closest(".like-button");
      if (likeButton) {
        event.stopPropagation();  // empêche d'ouvrir aussi la modale
        const card = likeButton.closest(".song");
        const index = Number(card.dataset.index);
        await toggleLike(currentFilteredSongs[index], likeButton);
        refreshSession("songs",state.songs);
        return;
      }
      const card = event.target.closest(".song");
      if (!card) return;
      const index = Number(card.dataset.index);
      openModal(currentFilteredSongs[index]);
    });

    props.suggest.addEventListener("click", async () => {
      const client = await supabase.createClient(client_url,sup_key);
      const {data: {user}, error: userError} = await client.auth.getUser();
      if (user) console.table(user);
      const {error} = await client
        .from("proposals")
        .insert({
          title: props.title.value,
          artist: props.artist.value,
          submitted_by : user?.email || "anonyme" 
        });
      if (error) alert("Erreur : " + error.message);
      else alert("Merci, ta proposition a été envoyée !");
    }
  )

    modals.close.addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", (event) => {
      if (event.target.id === "overlay") closeModal();
    });

    modals.details.addEventListener("click", (event) => 
      {const pill = event.target.closest(".pill");
      if (!pill) return;
      const type = pill.dataset.type;
      if (type === "theme"){
        state.theme = pill.textContent;
        nodes.theme.value = pill.textContent;
        nodes.category.value = "";
        nodes.categoryWrap.classList.remove("close");
        document.getElementById("overlay").classList.remove("open");
        renderFilters();
        renderList();
      }
      else if(type==="category"){
        state.theme= pill.dataset.origin;
        state.category = pill.textContent;
        nodes.theme.value = state.theme;
        nodes.categoryWrap.classList.remove("close");
        document.getElementById("overlay").classList.remove("open");
        renderFilters();
        nodes.category.value = pill.textContent;
        renderList();
      }
      });

    modals.details2.addEventListener("click", (event) => 
      {const pill = event.target.closest(".pill");
      if (!pill) return;
      const type = pill.dataset.type;
      if (type === "year"){
        state.year = pill.textContent;
        nodes.year.value = pill.textContent;
        document.getElementById("overlay").classList.remove("open");
        renderFilters();
        renderList();
      }
      else {
        albumId = pill.dataset.id;
        if (albumId) window.location.href = `album.html?id=${albumId}&whatisit=${type}`;
      }
      });

      modals.artist.addEventListener("click",(event) =>
      {const artiste = event.target.closest(".artist-link");
      if (!artiste) return;
      if (artiste.dataset.id) window.location.href = `artist.html?id=${artiste.dataset.id}&artist=${artiste.textContent}&type=${artiste.dataset.type}`; 
      })

    const up = document.getElementById("up");

    window.addEventListener("scroll", () => {
        const scrollY = window.scrollY;
        const shrinkEnd = 400;   // fin de la phase "rétrécit"
        const growEnd = 1200;      // fin de la phase "regrossit"

        let scale, opacity, translateY,centre,top;
        const ease = p => p * p * (3 - 2 * p); // smoothstep

        if (scrollY <= shrinkEnd) {
          // Phase 1 : rétrécit progressivement
          const progress = scrollY / shrinkEnd;
          scale = 1 - progress * 0.55;
          opacity = 1 - progress * 0.6;
          translateY = progress * -100;
          top = "20px";
          centre = "0px";
        } else if (scrollY <= growEnd) {
          // Phase 2 : regrossit progressivement
          const progress = (scrollY - shrinkEnd) / (growEnd - shrinkEnd);
          scale = 0.45 + progress * 1.55;       // de 0.3 remonte vers 1
          opacity = 0.4 + progress * 0.6;      // redevient plus opaque
          translateY = -100 + progress * 100;  // redescend
          top = "30%";
          centre = "-30%";
        } else {
          // Phase 3 : reste à sa taille finale
          scale = 2;
          opacity = 1;
          translateY = 0;
          top = "50%";
          centre = "-50%";
        }

        logo.style.transform = `translateX(-50%) translateY(calc(${centre} + ${translateY}px)) scale(${scale}) `;
        logo.style.top = `${top}`;
        logo.style.opacity = opacity;
        if (window.scrollY > 300) {
            up.classList.add("show");
        } else {
            up.classList.remove("show");
        }
    });

    up.addEventListener("click", () => {
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });


    loadSongs();
    ([state.artist,state.title,state.theme,state.kw].some(Boolean)) ? nodes.list.classList.remove("hide") : nodes.list.classList.add("hide");
  </script>
</body>
</html>
