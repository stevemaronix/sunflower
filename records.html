<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hummingbird</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Water+Brush&family=DynaPuff&family=Clicker+Script&display=swap" rel="stylesheet">
</head>
<body>
    <a href="page.html" class="pill" id="retour"><- Retour</a>
    <main class="records-global shell">
        <h2 style="font-size: 40px">Mes Records</h2>
        <p id="count" class="meta">Chargement du catalogue...</p>
        <section class="grid" id="artistList" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        </section>
    </main>
    <button id="menuToggle" aria-label="Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>

    <nav id="sideMenu" class="side-menu">
        <a href="page.html">Recherche</a>
        <a href="records.html">Mes records</a>
        <a href="suggest.html">Suggestions personnalisées</a>
    </nav>

    <div id="menuOverlay" class="menu-overlay"></div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<script>
    const client = supabase.createClient(client_url, sup_key);
    const { data: { user } } = async () => {await client.auth.getUser()};
    const state = {
        songs: [],
        liked: []
    }

    const nodes = {
        list: document.getElementById("artistList"),
        count: document.getElementById("count")
    }

    function renderListSongs(){
        state.liked = state.songs.filter(song => song.liked);
        nodes.list.innerHTML = state.liked.map(renderSongCard).join("");
        const total = state.liked.length;
        nodes.count.textContent = `${total} record${total > 1 ? "s" : ""} enregistré${total > 1 ? "s" : ""}`;

    }


    async function loadSongs(forceRefresh = false){
        try {

                if (!forceRefresh) {
                    const cached = sessionStorage.getItem("songs");
                    if (cached) {
                        console.table(cached);
                        state.songs = JSON.parse(cached);
                        renderListSongs();
                        return
                    };
                }
                const response = await fetch(`${sup_url}songs?select=id,title,artist,description,year,keywords,artists(id,name,link),theme,link,categories(name),groups(id,name),EP(id,pochette,link),singles(id,pochette,link),created_at&order=title.asc&${query}`, {
                headers: {
                    apikey: `${sup_key}`,
                    Authorization: `Bearer ${sup_key}`,
                },
            });

                let likedIds = new Set();

                if (user) {
                const { data: likes } = await client
                    .from("liked")
                    .select("song_id")
                    .eq("user_id", user.id);
                likedIds = new Set((likes || []).map(l => l.song_id));
                }

                const data = await response.json()

                if (!response.ok) {
                throw new Error(data.message || "Impossible de charger les chansons.");
                }

                state.songs = (Array.isArray(data) ? data : []).map(song => ({
                ...song,
                liked: likedIds.has(song.id),
                }));

                sessionStorage.setItem("songs",JSON.stringify(state.songs));

                console.log(state.songs);
                renderListSongs();
        } catch (error) {
            nodes.count.textContent = "Catalogue indisponible";
            nodes.list.innerHTML = `<div class="notice">${escapeHtml(error.message)}</div>`;
        }
    }

    async function render(){
        await loadSongs();
    }

    if (user){
        render();
    }
    else{
        nodes.count.innerHTML = "Vous n'avez aucun record enregistré car vous n'êtes pas connectés. <a class='connect-redirect' href='index.html'>Se connecter</a>"
    }

    nodes.list.addEventListener("click", async (event) => {
      const likeButton = event.target.closest(".like-button");
      if (likeButton) {
        event.stopPropagation();  // empêche d'ouvrir aussi la modale
        const card = likeButton.closest(".song");
        const index = Number(card.dataset.index);
        await toggleLike(state.liked[index], likeButton);
        refreshSession("songs",state.songs);
        renderListSongs();
        return;
      }
      const card = event.target.closest(".song");
      if (!card) return;
      const index = Number(card.dataset.index);
      const song=state.liked[index];
      if (song.link){
        window.open(song.link,"_blank");
      }
    });

</script>
</html>
